name: AI OR-Tools dependency smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ai-generate-preview
    paths:
      - 'services/ai-optimizer/**'
      - '.github/workflows/ai-ortools-smoke.yml'

jobs:
  ortools-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/ai-optimizer/requirements.txt
      - name: Install OR-Tools
        run: python -m pip install -r services/ai-optimizer/requirements.txt
      - name: Solve CP-SAT smoke model
        run: |
          python - <<'PY'
          from ortools.sat.python import cp_model
          model = cp_model.CpModel()
          x = model.new_bool_var("staff_covers_client")
          model.add(x == 1)
          solver = cp_model.CpSolver()
          result = solver.solve(model)
          assert result in (cp_model.OPTIMAL, cp_model.FEASIBLE)
          assert solver.value(x) == 1
          print("OR-Tools dependency and CP-SAT smoke test passed")
          PY
