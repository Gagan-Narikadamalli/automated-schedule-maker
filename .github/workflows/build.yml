name: Build verification

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test automatic scheduler rules
        run: npm run test:scheduler

      - name: Build application
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/sos_scheduler_build
