name: Build verification

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build
        env:
          # The build only type-checks database code. Runtime requests use the real
          # MONGODB_URI configured securely in Vercel.
          MONGODB_URI: mongodb://127.0.0.1:27017/sos_scheduler_build
          AUTH_SECRET: build-only-auth-secret-not-used-at-runtime
          SETUP_KEY: build-only-setup-key-not-used-at-runtime
          GMAIL_USER: build@example.com
          GMAIL_APP_PASSWORD: build-only-password
