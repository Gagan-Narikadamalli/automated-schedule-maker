name: Build verification

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test automatic scheduler rules
        run: npm run test:scheduler

      - name: Test BT break priority and nap alignment
        run: npx tsx scripts/test-break-eligibility.ts

      - name: Test timed attendance overrides
        run: npx tsx scripts/test-attendance-windows.ts

      - name: Test template nap and break linking
        run: npx tsx scripts/test-template-nap-links.ts

      - name: Test multiple weekday template selection
        run: npx tsx scripts/test-multi-weekday-template-selection.ts

      - name: Build application
        run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/sos_scheduler_build
